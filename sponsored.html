<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recommended Content | AI News Factory</title>

  <meta
    name="description"
    content="Explore recommended content from AI News Factory."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 30px 18px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .brand {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      margin: 10px 0 15px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: #555;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 28px;
      border-radius: 8px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    .button:hover {
      opacity: 0.85;
    }

    .notice {
      margin-top: 25px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="brand">
        AI News Factory
      </div>

      <h1>Recommended Content</h1>

      <p>
        We've selected additional content that may be useful or
        interesting to our readers.
      </p>

      <p>
        This is sponsored/recommended content provided through
        our advertising partner.
      </p>

      <a
        class="button"
        href="https://pleased-report.com/XRnFI2"
        target="_blank"
        rel="nofollow sponsored noopener"
      >
        Continue to Recommended Content
      </a>

      <div class="notice">
        Sponsored content · External destination
      </div>

    </div>

  </div>

</body>
</html>
