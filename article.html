<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AI News Factory — intelligent, contextual and trustworthy news.">
<meta name="theme-color" content="#080808">
<title>Article | AI News Factory</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
.article-page{
  max-width:1100px;
  margin:0 auto;
  padding:70px 24px 100px;
}
.article-breadcrumb{
  margin-bottom:30px;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.12em;
  opacity:.65;
}
.article-breadcrumb a{
  color:inherit;
  text-decoration:none;
}
.article-category{
  display:inline-block;
  margin-bottom:18px;
  font-size:12px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.article-title{
  max-width:950px;
  margin:0 0 25px;
  font-family:Georgia,serif;
  font-size:clamp(40px,6vw,76px);
  line-height:1.02;
  letter-spacing:-.04em;
}
.article-excerpt{
  max-width:820px;
  margin:0 0 30px;
  font-size:20px;
  line-height:1.6;
  opacity:.72;
}
.article-meta{
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  margin:25px 0 40px;
  padding:20px 0;
  border-top:1px solid rgba(128,128,128,.25);
  border-bottom:1px solid rgba(128,128,128,.25);
  font-size:13px;
  opacity:.75;
}
.article-visual{
  width:100%;
  min-height:400px;
  margin:0 0 50px;
  border-radius:4px;
  background:
    radial-gradient(circle at 30% 35%,rgba(180,0,0,.55),transparent 35%),
    linear-gradient(135deg,#191919,#050505);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.article-visual img{
  width:100%;
  height:100%;
  min-height:400px;
  object-fit:cover;
  display:block;
}
.article-visual-placeholder{
  font-family:Georgia,serif;
  font-size:clamp(28px,5vw,60px);
  text-align:center;
  padding:40px;
  opacity:.35;
}
.article-layout{
  display:grid;
  grid-template-columns:minmax(0,760px) 260px;
  gap:70px;
  align-items:start;
}
.article-body{
  font-family:Georgia,serif;
  font-size:19px;
  line-height:1.85;
}
.article-body p{
  margin:0 0 28px;
}
.article-body p:first-child::first-letter{
  float:left;
  font-size:70px;
  line-height:.8;
  padding:8px 10px 0 0;
}
.article-sidebar{
  position:sticky;
  top:30px;
}
.article-sidebar-box{
  padding:22px;
  border:1px solid rgba(128,128,128,.25);
  margin-bottom:20px;
}
.article-sidebar-title{
  margin:0 0 15px;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.15em;
}
.article-tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.article-tag{
  padding:7px 10px;
  border:1px solid rgba(128,128,128,.3);
  font-size:11px;
}
.article-source{
  font-size:13px;
  line-height:1.6;
}
.article-source a{
  color:inherit;
}
.related-section{
  max-width:1100px;
  margin:80px auto 0;
  padding:50px 24px;
  border-top:1px solid rgba(128,128,128,.25);
}
.related-title{
  font-family:Georgia,serif;
  font-size:32px;
  margin:0 0 30px;
}
.related-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}
.related-card{
  padding:22px;
  border:1px solid rgba(128,128,128,.25);
  transition:transform .2s ease;
}
.related-card:hover{
  transform:translateY(-4px);
}
.related-card a{
  color:inherit;
  text-decoration:none;
}
.related-card-category{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.14em;
  opacity:.6;
}
.related-card h3{
  font-family:Georgia,serif;
  font-size:21px;
  line-height:1.2;
  margin:10px 0;
}
.related-card p{
  font-size:13px;
  line-height:1.5;
  opacity:.65;
}
.article-error{
  text-align:center;
  padding:120px 20px;
}
.article-error h1{
  font-family:Georgia,serif;
  font-size:48px;
}
.article-error a{
  color:inherit;
}
@media(max-width:850px){
  .article-layout{
    grid-template-columns:1fr;
    gap:40px;
  }
  .article-sidebar{
    position:static;
  }
  .related-grid{
    grid-template-columns:1fr;
  }
  .article-visual,
  .article-visual img{
    min-height:260px;
  }
}
@media(max-width:600px){
  .article-page{
    padding:45px 18px 70px;
  }
  .article-title{
    font-size:42px;
  }
  .article-excerpt{
    font-size:17px;
  }
  .article-body{
    font-size:18px;
  }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="live-indicator">
      <span class="live-dot"></span>
      LIVE NEWSROOM
    </div>
    <div class="header-date" data-current-date>
      Loading...
    </div>
    <button
      class="theme-toggle"
      id="themeToggle"
      type="button"
      aria-label="Toggle theme">
      ◐
    </button>
  </div>
</header>

<main id="articleContainer">

  <div class="article-page">
    <div class="article-breadcrumb">
      <a href="index.html">AI News Factory</a>
      &nbsp; / &nbsp;
      Article
    </div>

    <div id="articleLoading">
      Loading story...
    </div>
  </div>

</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div>
      <strong>AI NEWS FACTORY</strong>
      <p>INTELLIGENCE. CONTEXT. TRUTH.</p>
    </div>
    <div>
      © <span data-current-year></span> AI News Factory
    </div>
  </div>
</footer>

<script src="assets/js/app.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  const container =
    document.getElementById("articleContainer");

  const params =
    new URLSearchParams(window.location.search);

  const slug =
    params.get("slug");

  if (!slug) {
    showError(
      "No article was selected.",
      "Return to the homepage and choose a story."
    );
    return;
  }

  try {

    const response =
      await fetch("data/articles.json");

    if (!response.ok) {
      throw new Error(
        "Unable to load article data."
      );
    }

    const articles =
      await response.json();

    const article =
      articles.find(
        item => item.slug === slug
      );

    if (!article) {
      showError(
        "Story not found.",
        "The article may have been moved or is no longer available."
      );
      return;
    }

    renderArticle(article, articles);

  } catch (error) {

    console.error(
      "Article loading error:",
      error
    );

    showError(
      "Unable to load this story.",
      "Please refresh the page and try again."
    );
  }

  function renderArticle(article, articles) {

    document.title =
      article.title +
      " | AI News Factory";

    const content =
      Array.isArray(article.content)
        ? article.content
        : [article.content || ""];

    const tags =
      Array.isArray(article.tags)
        ? article.tags
        : [];

    const sources =
      Array.isArray(article.sources)
        ? article.sources
        : [];

    const related =
      articles
        .filter(
          item =>
            item.id !== article.id &&
            item.category === article.category
        )
        .slice(0,3);

    const imageBlock =
      article.image
        ? `
          <div class="article-visual">
            <img
              src="${escapeHtml(article.image)}"
              alt="${escapeHtml(article.title)}">
          </div>
        `
        : `
          <div class="article-visual">
            <div class="article-visual-placeholder">
              ${escapeHtml(article.category)}
            </div>
          </div>
        `;

    const tagBlock =
      tags.length
        ? `
          <div class="article-sidebar-box">
            <h3 class="article-sidebar-title">
              Topics
            </h3>
            <div class="article-tags">
              ${tags.map(tag => `
                <span class="article-tag">
                  ${escapeHtml(tag)}
                </span>
              `).join("")}
            </div>
          </div>
        `
        : "";

    const sourceBlock =
      sources.length
        ? `
          <div class="article-sidebar-box">
            <h3 class="article-sidebar-title">
              Sources
            </h3>
            <div class="article-source">
              ${sources.map(source => {

                if (
                  source.url &&
                  source.url !== "#"
                ) {
                  return `
                    <div>
                      <a
                        href="${escapeHtml(source.url)}"
                        target="_blank"
                        rel="noopener noreferrer">
                        ${escapeHtml(source.name)}
                      </a>
                    </div>
                  `;
                }

                return `
                  <div>
                    ${escapeHtml(source.name || "Source")}
                  </div>
                `;

              }).join("")}
            </div>
          </div>
        `
        : "";

    const relatedBlock =
      related.length
        ? `
          <section class="related-section">
            <h2 class="related-title">
              More from ${escapeHtml(article.category)}
            </h2>

            <div class="related-grid">

              ${related.map(item => `
                <article class="related-card">

                  <a
                    href="article.html?slug=${encodeURIComponent(item.slug)}">

                    <div class="related-card-category">
                      ${escapeHtml(item.category)}
                    </div>

                    <h3>
                      ${escapeHtml(item.title)}
                    </h3>

                    <p>
                      ${escapeHtml(item.excerpt || "")}
                    </p>

                  </a>

                </article>
              `).join("")}

            </div>
          </section>
        `
        : "";

    container.innerHTML = `

      <article class="article-page">

        <div class="article-breadcrumb">
          <a href="index.html">
            AI News Factory
          </a>
          &nbsp; / &nbsp;
          ${escapeHtml(article.category)}
        </div>

        <div class="article-category">
          ${escapeHtml(article.category)}
        </div>

        <h1 class="article-title">
          ${escapeHtml(article.title)}
        </h1>

        <p class="article-excerpt">
          ${escapeHtml(article.excerpt || "")}
        </p>

        <div class="article-meta">

          <span>
            By ${escapeHtml(article.author || "AI News Factory Desk")}
          </span>

          <span>
            ${formatDate(article.date)}
          </span>

          <span>
            ${escapeHtml(article.time || "")}
          </span>

          <span>
            ${escapeHtml(article.readTime || "5 min read")}
          </span>

        </div>

        ${imageBlock}

        <div class="article-layout">

          <div class="article-body">

            ${content.map(paragraph => `
              <p>
                ${escapeHtml(paragraph)}
              </p>
            `).join("")}

          </div>

          <aside class="article-sidebar">

            ${tagBlock}

            ${sourceBlock}

            <div class="article-sidebar-box">

              <h3 class="article-sidebar-title">
                AI News Factory
              </h3>

              <p class="article-source">
                Intelligent reporting built around
                context, evidence and responsible
                news analysis.
              </p>

            </div>

          </aside>

        </div>

      </article>

      ${relatedBlock}
    `;
  }

  function showError(title, message) {

    container.innerHTML = `

      <div class="article-page article-error">

        <h1>
          ${escapeHtml(title)}
        </h1>

        <p>
          ${escapeHtml(message)}
        </p>

        <p>
          <a href="index.html">
            ← Return to AI News Factory
          </a>
        </p>

      </div>
    `;
  }

  function formatDate(value) {

    if (!value) {
      return "";
    }

    const date =
      new Date(value + "T00:00:00");

    if (Number.isNaN(date.getTime())) {
      return value;
    }

    return date.toLocaleDateString(
      "en-US",
      {
        year: "numeric",
        month: "long",
        day: "numeric"
      }
    );
  }

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

});
</script>

</body>
  </html>
