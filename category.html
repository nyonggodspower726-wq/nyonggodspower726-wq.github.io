<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="AI News Factory — category news, analysis and intelligence.">
<meta name="theme-color" content="#080808">
<title>Category | AI News Factory</title>

<link rel="stylesheet" href="assets/css/style.css">

<style>
.category-page{
  max-width:1400px;
  margin:auto;
  padding:70px 24px 100px;
}

.category-header{
  padding-bottom:40px;
  margin-bottom:45px;
  border-bottom:1px solid rgba(128,128,128,.25);
}

.category-kicker{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.18em;
  opacity:.6;
  margin-bottom:15px;
}

.category-title{
  margin:0;
  font-family:Georgia,serif;
  font-size:clamp(46px,7vw,90px);
  line-height:.98;
  letter-spacing:-.05em;
}

.category-description{
  max-width:700px;
  margin:22px 0 0;
  font-size:17px;
  line-height:1.7;
  opacity:.65;
}

.category-count{
  margin-top:18px;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.12em;
  opacity:.5;
}

.category-nav{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:35px;
}

.category-nav a{
  padding:9px 14px;
  border:1px solid rgba(128,128,128,.25);
  color:inherit;
  text-decoration:none;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.1em;
  transition:.2s ease;
}

.category-nav a:hover,
.category-nav a.active{
  border-color:#b40000;
  background:rgba(180,0,0,.1);
}

.category-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
}

.category-card{
  border:1px solid rgba(128,128,128,.25);
  overflow:hidden;
  transition:
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
  background:rgba(128,128,128,.025);
}

.category-card:hover{
  transform:translateY(-6px);
  border-color:rgba(180,0,0,.65);
  box-shadow:0 18px 45px rgba(0,0,0,.2);
}

.category-card-link{
  display:block;
  color:inherit;
  text-decoration:none;
}

.category-card-visual{
  min-height:210px;
  background:
    radial-gradient(
      circle at 30% 30%,
      rgba(180,0,0,.45),
      transparent 38%
    ),
    linear-gradient(135deg,#1b1b1b,#060606);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.category-card-visual img{
  width:100%;
  height:210px;
  object-fit:cover;
  display:block;
}

.category-card-placeholder{
  font-family:Georgia,serif;
  font-size:35px;
  opacity:.25;
}

.category-card-content{
  padding:24px;
}

.category-card-category{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.15em;
  opacity:.55;
  margin-bottom:12px;
}

.category-card h2{
  margin:0 0 14px;
  font-family:Georgia,serif;
  font-size:25px;
  line-height:1.15;
}

.category-card-excerpt{
  font-size:14px;
  line-height:1.6;
  opacity:.62;
  margin:0 0 18px;
}

.category-card-meta{
  display:flex;
  justify-content:space-between;
  gap:12px;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  opacity:.45;
}

.category-empty{
  padding:100px 20px;
  text-align:center;
  border:1px solid rgba(128,128,128,.2);
}

.category-empty h2{
  font-family:Georgia,serif;
  font-size:38px;
}

.category-empty a{
  color:inherit;
  text-decoration:underline;
}

.category-loading{
  padding:80px 20px;
  text-align:center;
  opacity:.55;
}

.back-to-top{
  position:fixed;
  right:22px;
  bottom:22px;
  width:44px;
  height:44px;
  border:1px solid rgba(128,128,128,.4);
  background:#080808;
  color:#fff;
  cursor:pointer;
  opacity:0;
  visibility:hidden;
  transform:translateY(10px);
  transition:.25s ease;
  z-index:100;
}

.back-to-top.is-visible{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

.back-to-top:hover{
  border-color:#b40000;
  background:#b40000;
}

@media(max-width:1000px){
  .category-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:760px){

  .category-page{
    padding:45px 18px 70px;
  }

  .category-grid{
    grid-template-columns:1fr;
  }

  .category-title{
    font-size:50px;
  }

  .category-nav{
    overflow-x:auto;
    flex-wrap:nowrap;
    padding-bottom:6px;
    scrollbar-width:none;
  }

  .category-nav::-webkit-scrollbar{
    display:none;
  }

  .category-nav a{
    white-space:nowrap;
  }

  .category-card-content{
    padding:20px;
  }

}

@media(max-width:430px){

  .category-title{
    font-size:43px;
  }

  .category-description{
    font-size:15px;
  }

  .category-card h2{
    font-size:22px;
  }

}
</style>
</head>

<body>

<header class="site-header">

  <div class="header-inner">

    <div class="live-indicator" data-live-indicator>
      <span class="live-dot"></span>
      LIVE NEWSROOM
    </div>

    <div
      class="header-date"
      id="headerDate"
      data-current-date>
      Loading...
    </div>

    <div class="header-actions">

      <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false">
        ☰
      </button>

      <button
        class="search-toggle"
        id="searchButton"
        type="button"
        aria-label="Search">
        ⌕
      </button>

      <button
        class="theme-toggle"
        id="themeToggle"
        type="button"
        aria-label="Toggle theme">
        ◐
      </button>

    </div>

  </div>

  <nav class="main-nav" aria-label="Main navigation">

    <a href="index.html">Home</a>

    <a href="category.html?category=Latest">
      Latest
    </a>

    <a href="category.html?category=AI">
      AI
    </a>

    <a href="category.html?category=Technology">
      Technology
    </a>

    <a href="category.html?category=Business">
      Business
    </a>

    <a href="category.html?category=Science">
      Science
    </a>

    <a href="category.html?category=World">
      World
    </a>

  </nav>

</header>

<main id="categoryContainer">

  <div class="category-page">

    <nav
      class="category-nav"
      aria-label="News categories">

      <a href="category.html?category=Latest">
        Latest
      </a>

      <a href="category.html?category=AI">
        AI
      </a>

      <a href="category.html?category=Technology">
        Technology
      </a>

      <a href="category.html?category=Business">
        Business
      </a>

      <a href="category.html?category=Science">
        Science
      </a>

      <a href="category.html?category=World">
        World
      </a>

    </nav>

    <div class="category-header">

      <div class="category-kicker">
        AI News Factory
      </div>

      <h1 class="category-title">
        Loading...
      </h1>

      <p class="category-description">
        Loading category intelligence...
      </p>

      <div class="category-count">
        Loading stories...
      </div>

    </div>

    <div class="category-grid">

      <div class="category-loading">
        Loading stories...
      </div>

    </div>

  </div>

</main>

<footer class="site-footer">

  <div class="footer-inner">

    <div>
      <strong>AI NEWS FACTORY</strong>
      <p>INTELLIGENCE. CONTEXT. TRUTH.</p>
    </div>

    <div>
      © <span data-current-year></span>
      AI News Factory
    </div>

  </div>

</footer>

<button
  class="back-to-top"
  id="backToTop"
  data-back-to-top
  type="button"
  aria-label="Back to top">
  ↑
</button>

<script src="assets/js/app.js"></script>

<script>
"use strict";

document.addEventListener("DOMContentLoaded",function(){

  const container=document.getElementById("categoryContainer");

  const state={
    articles:[],
    category:"Latest"
  };

  const params=new URLSearchParams(window.location.search);

  state.category=(params.get("category")||"Latest").trim();

  if(!state.category){
    state.category="Latest";
  }

  loadCategory();

  window.addEventListener("popstate",function(){
    const nextParams=new URLSearchParams(window.location.search);
    state.category=(nextParams.get("category")||"Latest").trim()||"Latest";
    loadCategory();
  });

  async function loadCategory(){

    showLoading();

    try{

      const response=await fetch(
        "data/articles.json?v="+Date.now(),
        {
          cache:"no-store"
        }
      );

      if(!response.ok){
        throw new Error(
          "Unable to load article data."
        );
      }

      const data=await response.json();

      state.articles=
        Array.isArray(data)
          ? data
          : [];

      const stories=getStories(
        state.category
      );

      renderCategory(
        state.category,
        stories
      );

      setActiveNavigation(
        state.category
      );

      document.title=
        (
          state.category==="Latest"
            ? "Latest News"
            : state.category
        )+" | AI News Factory";

    }catch(error){

      console.error(
        "Category loading error:",
        error
      );

      showError();

    }

  }

  function getStories(category){

    let stories=[];

    if(
      category.toLowerCase()==="latest"||
      category.toLowerCase()==="all"
    ){

      stories=[...state.articles];

    }else{

      stories=state.articles.filter(
        function(article){

          return String(
            article.category||""
          ).toLowerCase()===
          category.toLowerCase();

        }
      );

    }

    return stories.sort(function(a,b){

      return getTimestamp(b)-
             getTimestamp(a);

    });

  }

  function getTimestamp(article){

    const value=
      article.published_at||
      article.date||
      article.created_at||
      0;

    const timestamp=
      new Date(value).getTime();

    return Number.isNaN(timestamp)
      ? 0
      : timestamp;

  }

  function renderCategory(
    category,
    stories
  ){

    const description=
      getDescription(category);

    container.innerHTML=`

      <div class="category-page">

        <nav
          class="category-nav"
          aria-label="News categories">

          ${buildCategoryLinks(category)}

        </nav>

        <div class="category-header">

          <div class="category-kicker">
            AI News Factory
          </div>

          <h1 class="category-title">
            ${escapeHtml(category)}
          </h1>

          <p class="category-description">
            ${escapeHtml(description)}
          </p>

          <div class="category-count">
            ${stories.length}
            ${stories.length===1?"STORY":"STORIES"}
          </div>

        </div>

        ${
          stories.length
            ? `
              <div class="category-grid">
                ${stories.map(createCard).join("")}
              </div>
            `
            : createEmptyState(category)
        }

      </div>

    `;

    activateCardLinks();

  }

  function buildCategoryLinks(active){

    const categories=[
      "Latest",
      "AI",
      "Technology",
      "Business",
      "Science",
      "World"
    ];

    return categories.map(function(name){

      const activeClass=
        name.toLowerCase()===
        active.toLowerCase()
          ? "active"
          : "";

      return`

        <a
          href="category.html?category=${encodeURIComponent(name)}"
          class="${activeClass}"
          data-category="${escapeHtml(name)}">

          ${escapeHtml(name)}

        </a>

      `;

    }).join("");

  }

  function createCard(article){

    const slug=
      article.slug||
      article.id||
      "";

    const title=
      article.title||
      "Untitled story";

    const category=
      article.category||
      "News";

    const excerpt=
      article.excerpt||
      article.summary||
      "";

    const image=
      article.image||
      article.image_url||
      "";

    const published=
      article.published_at||
      article.date||
      article.created_at||
      "";

    const readTime=
      article.read_time||
      article.readTime||
      article.reading_time||
      "5 min read";

    const href=
      "article.html?slug="+
      encodeURIComponent(slug);

    const visual=image
      ?`

        <div class="category-card-visual">

          <img
            src="${escapeHtml(image)}"
            alt="${escapeHtml(title)}"
            loading="lazy">

        </div>

      `
      :`

        <div class="category-card-visual">

          <div class="category-card-placeholder">
            ${escapeHtml(category)}
          </div>

        </div>

      `;

    return`

      <article class="category-card">

        <a
          class="category-card-link"
          href="${href}"
          aria-label="Read: ${escapeHtml(title)}">

          ${visual}

          <div class="category-card-content">

            <div class="category-card-category">
              ${escapeHtml(category)}
            </div>

            <h2>
              ${escapeHtml(title)}
            </h2>

            ${
              excerpt
                ? `
                  <p class="category-card-excerpt">
                    ${escapeHtml(excerpt)}
                  </p>
                `
                : ""
            }

            <div class="category-card-meta">

              <span>
                ${formatDate(published)}
              </span>

              <span>
                ${escapeHtml(readTime)}
              </span>

            </div>

          </div>

        </a>

      </article>

    `;

  }

  function createEmptyState(category){

    return`

      <div class="category-empty">

        <h2>
          No stories yet
        </h2>

        <p>
          There are currently no published
          stories in ${escapeHtml(category)}.
        </p>

        <p>
          <a href="index.html">
            ← Return to homepage
          </a>
        </p>

      </div>

    `;

  }

  function showLoading(){

    container.innerHTML=`

      <div class="category-page">

        <nav
          class="category-nav"
          aria-label="News categories">

          ${buildCategoryLinks(state.category)}

        </nav>

        <div class="category-header">

          <div class="category-kicker">
            AI News Factory
          </div>

          <h1 class="category-title">
            ${escapeHtml(state.category)}
          </h1>

          <p class="category-description">
            Loading category intelligence...
          </p>

          <div class="category-count">
            Loading stories...
          </div>

        </div>

        <div class="category-loading">
          Loading stories...
        </div>

      </div>

    `;

  }

  function showError(){

    container.innerHTML=`

      <div class="category-page">

        <div class="category-empty">

          <h2>
            Unable to load stories
          </h2>

          <p>
            The newsroom could not load the
            article database right now.
          </p>

          <p>
            <a href="index.html">
              ← Return to homepage
            </a>
          </p>

          <p>
            <a
              href="category.html?category=${encodeURIComponent(state.category)}">

              Try again

            </a>
          </p>

        </div>

      </div>

    `;

  }

  function activateCardLinks(){

    container
      .querySelectorAll(".category-card-link")
      .forEach(function(link){

        link.addEventListener(
          "click",
          function(){

            window.location.href=
              this.getAttribute("href");

          }
        );

      });

  }

  function setActiveNavigation(active){

    document
      .querySelectorAll(
        ".main-nav a,.category-nav a"
      )
      .forEach(function(link){

        link.classList.remove("active");

        const href=
          link.getAttribute("href")||"";

        const url=
          new URL(
            href,
            window.location.href
          );

        const value=
          url.searchParams.get("category");

        if(
          value&&
          value.toLowerCase()===
          active.toLowerCase()
        ){

          link.classList.add("active");

        }

      });

  }

  function getDescription(name){

    const descriptions={

      ai:
        "Artificial intelligence, machine learning, AI agents, models and the technologies reshaping the future.",

      technology:
        "Technology, innovation, digital infrastructure and the developments changing how the world works.",

      business:
        "Markets, companies, industries, economic developments and the forces shaping global business.",

      science:
        "Scientific discoveries, research, breakthroughs and the evidence behind important developments.",

      world:
        "Important developments, events and stories from around the world, with context beyond the headline.",

      politics:
        "Political developments, public policy, leadership and the decisions shaping societies.",

      latest:
        "The latest stories published by AI News Factory across our global newsroom.",

      all:
        "Explore every published story from the AI News Factory newsroom."

    };

    return descriptions[
      name.toLowerCase()
    ]||
      "News, analysis and intelligent reporting from the AI News Factory newsroom.";

  }

  function formatDate(value){

    if(!value){
      return "";
    }

    const date=new Date(value);

    if(Number.isNaN(date.getTime())){
      return String(value);
    }

    return date.toLocaleDateString(
      "en-US",
      {
        year:"numeric",
        month:"short",
        day:"numeric"
      }
    );

  }

  function escapeHtml(value){

    return String(value??"")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }

});
</script>

</body>
        </html>
