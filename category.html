<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="AI News Factory — category news, analysis and intelligence.">
<meta name="theme-color" content="#080808">
<title>Category | AI News Factory</title>
<link rel="stylesheet" href="assets/css/style.css">

<style>
.category-page{max-width:1400px;margin:auto;padding:70px 24px 100px}
.category-header{padding-bottom:40px;margin-bottom:45px;border-bottom:1px solid rgba(128,128,128,.25)}
.category-kicker{font-size:12px;text-transform:uppercase;letter-spacing:.18em;opacity:.6;margin-bottom:15px}
.category-title{margin:0;font-family:Georgia,serif;font-size:clamp(46px,7vw,90px);line-height:.98;letter-spacing:-.05em}
.category-description{max-width:700px;margin:22px 0 0;font-size:17px;line-height:1.7;opacity:.65}
.category-count{margin-top:18px;font-size:12px;text-transform:uppercase;letter-spacing:.12em;opacity:.5}

.category-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}

.category-card{
  position:relative;
  border:1px solid rgba(128,128,128,.25);
  overflow:hidden;
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
  background:rgba(128,128,128,.025)
}
.category-card:hover{
  transform:translateY(-6px);
  border-color:rgba(180,0,0,.65);
  box-shadow:0 18px 45px rgba(0,0,0,.2)
}
.category-card-link{
  position:absolute;
  inset:0;
  z-index:1;
  text-indent:-9999px
}
.category-card-visual{
  min-height:210px;
  background:
    radial-gradient(circle at 30% 30%,rgba(180,0,0,.45),transparent 38%),
    linear-gradient(135deg,#1b1b1b,#060606);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden
}
.category-card-visual img{
  width:100%;
  height:210px;
  object-fit:cover;
  display:block
}
.category-card-placeholder{
  font-family:Georgia,serif;
  font-size:35px;
  opacity:.25
}
.category-card-content{padding:24px}
.category-card-category{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.15em;
  opacity:.55;
  margin-bottom:12px
}
.category-card h2{
  margin:0 0 14px;
  font-family:Georgia,serif;
  font-size:25px;
  line-height:1.15
}
.category-card h2 a{color:inherit;text-decoration:none;position:relative;z-index:2}
.category-card-excerpt{font-size:14px;line-height:1.6;opacity:.62;margin:0 0 18px}
.category-card-meta{
  display:flex;
  justify-content:space-between;
  gap:12px;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  opacity:.45
}
.category-empty{padding:100px 20px;text-align:center;border:1px solid rgba(128,128,128,.2)}
.category-empty h2{font-family:Georgia,serif;font-size:38px}
.category-empty a{color:inherit}

.category-nav{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:0 0 35px
}
.category-nav a{
  padding:9px 14px;
  border:1px solid rgba(128,128,128,.25);
  color:inherit;
  text-decoration:none;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.1em;
  transition:.2s ease
}
.category-nav a:hover,
.category-nav a.active{
  border-color:#b40000;
  background:rgba(180,0,0,.1)
}

.back-to-top{
  position:fixed;
  right:22px;
  bottom:22px;
  width:44px;
  height:44px;
  border:1px solid rgba(128,128,128,.4);
  background:#080808;
  color:#fff;
  cursor:pointer;
  opacity:0;
  visibility:hidden;
  transform:translateY(10px);
  transition:.25s ease;
  z-index:100
}
.back-to-top.is-visible{
  opacity:1;
  visibility:visible;
  transform:translateY(0)
}

@media(max-width:1000px){
  .category-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
  .category-page{padding:45px 18px 70px}
  .category-grid{grid-template-columns:1fr}
  .category-title{font-size:50px}
  .category-nav{overflow-x:auto;flex-wrap:nowrap;padding-bottom:5px}
  .category-nav a{white-space:nowrap}
}
</style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">

    <div class="live-indicator" data-live-indicator>
      <span class="live-dot"></span>
      LIVE NEWSROOM
    </div>

    <div class="header-date" id="headerDate" data-current-date>
      Loading...
    </div>

    <div class="header-actions">

      <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false">
        ☰
      </button>

      <button
        class="search-toggle"
        id="searchButton"
        type="button"
        aria-label="Search">
        ⌕
      </button>

      <button
        class="theme-toggle"
        id="themeToggle"
        type="button"
        aria-label="Toggle theme">
        ◐
      </button>

    </div>

  </div>

  <nav class="main-nav">

    <a href="index.html">Home</a>
    <a href="category.html?category=Latest">Latest</a>
    <a href="category.html?category=AI">AI</a>
    <a href="category.html?category=Technology">Technology</a>
    <a href="category.html?category=Business">Business</a>
    <a href="category.html?category=Science">Science</a>
    <a href="category.html?category=World">World</a>

  </nav>
</header>

<main id="categoryContainer">

  <div class="category-page">

    <nav class="category-nav" aria-label="News categories">

      <a href="category.html?category=Latest">Latest</a>
      <a href="category.html?category=AI">AI</a>
      <a href="category.html?category=Technology">Technology</a>
      <a href="category.html?category=Business">Business</a>
      <a href="category.html?category=Science">Science</a>
      <a href="category.html?category=World">World</a>

    </nav>

    <div class="category-header">

      <div class="category-kicker">
        AI News Factory
      </div>

      <h1 class="category-title">
        Loading...
      </h1>

      <p class="category-description">
        Loading category intelligence...
      </p>

      <div class="category-count">
        Loading stories...
      </div>

    </div>

    <div class="category-grid">
      <p>Loading stories...</p>
    </div>

  </div>

</main>

<footer class="site-footer">

  <div class="footer-inner">

    <div>
      <strong>AI NEWS FACTORY</strong>
      <p>INTELLIGENCE. CONTEXT. TRUTH.</p>
    </div>

    <div>
      © <span data-current-year></span>
      AI News Factory
    </div>

  </div>

</footer>

<button
  class="back-to-top"
  id="backToTop"
  data-back-to-top
  type="button"
  aria-label="Back to top">
  ↑
</button>

<script src="assets/js/app.js"></script>

<script>
document.addEventListener("DOMContentLoaded",async()=>{

const container=document.getElementById("categoryContainer");
const params=new URLSearchParams(location.search);
const requested=params.get("category")||"Latest";
const category=requested.trim()||"Latest";

try{

const response=await fetch(
"data/articles.json?v="+Date.now(),
{cache:"no-store"}
);

if(!response.ok)throw new Error("Unable to load article data.");

const data=await response.json();
const articles=Array.isArray(data)?data:[];

let stories;

if(
category.toLowerCase()==="latest"||
category.toLowerCase()==="all"
){

stories=[...articles].sort(sortByDate);

}else{

stories=articles
.filter(a=>
String(a.category||"")
.toLowerCase()===category.toLowerCase()
)
.sort(sortByDate);

}

renderCategory(category,stories);
activateCategoryNav(category);

}catch(error){

console.error("Category loading error:",error);

container.innerHTML=`
<div class="category-page">
<div class="category-empty">
<h2>Unable to load stories</h2>
<p>Please refresh the page and try again.</p>
<p><a href="index.html">← Return home</a></p>
</div>
</div>
`;

}

function sortByDate(a,b){

const dateA=new Date(
a.published_at||a.date||a.created_at||0
).getTime();

const dateB=new Date(
b.published_at||b.date||b.created_at||0
).getTime();

return dateB-dateA;

}

function renderCategory(name,stories){

const description=getDescription(name);

if(!stories.length){

container.innerHTML=`
<div class="category-page">

<nav class="category-nav" aria-label="News categories">
${categoryLinks(name)}
</nav>

<div class="category-header">

<div class="category-kicker">
AI News Factory
</div>

<h1 class="category-title">
${escapeHtml(name)}
</h1>

<p class="category-description">
${escapeHtml(description)}
</p>

<div class="category-count">
0 STORIES
</div>

</div>

<div class="category-empty">

<h2>No stories yet</h2>

<p>
There are currently no published stories in this category.
</p>

<p>
<a href="index.html">
← Return to homepage
</a>
</p>

</div>

</div>
`;

return;
}

container.innerHTML=`
<div class="category-page">

<nav class="category-nav" aria-label="News categories">
${categoryLinks(name)}
</nav>

<div class="category-header">

<div class="category-kicker">
AI News Factory
</div>

<h1 class="category-title">
${escapeHtml(name)}
</h1>

<p class="category-description">
${escapeHtml(description)}
</p>

<div class="category-count">
${stories.length}
${stories.length===1?"STORY":"STORIES"}
</div>

</div>

<div class="category-grid">

${stories.map(createCard).join("")}

</div>

</div>
`;

}

function categoryLinks(active){

const categories=[
"Latest",
"AI",
"Technology",
"Business",
"Science",
"World"
];

return categories.map(name=>`

<a
href="category.html?category=${encodeURIComponent(name)}"
class="${name.toLowerCase()===active.toLowerCase()?"active":""}">
${escapeHtml(name)}
</a>

`).join("");

}

function createCard(article){

const slug=article.slug||article.id||"";
const title=article.title||"Untitled story";
const categoryName=article.category||"News";
const excerpt=article.excerpt||article.summary||"";
const image=article.image||article.image_url||"";
const date=article.published_at||article.date||article.created_at||"";
const readTime=
article.read_time||
article.readTime||
article.reading_time||
"5 min read";

const visual=image
?`
<div class="category-card-visual">
<img
src="${escapeHtml(image)}"
alt="${escapeHtml(title)}"
loading="lazy"
onerror="this.parentElement.innerHTML='<div class=&quot;category-card-placeholder&quot;>NEWS</div>'">
</div>
`
:`
<div class="category-card-visual">
<div class="category-card-placeholder">
${escapeHtml(categoryName)}
</div>
</div>
`;

return`
<article class="category-card">

<a
class="category-card-link"
href="article.html?slug=${encodeURIComponent(slug)}"
aria-label="Read ${escapeHtml(title)}">
Read article
</a>

${visual}

<div class="category-card-content">

<div class="category-card-category">
${escapeHtml(categoryName)}
</div>

<h2>
<a href="article.html?slug=${encodeURIComponent(slug)}">
${escapeHtml(title)}
</a>
</h2>

<p class="category-card-excerpt">
${escapeHtml(excerpt)}
</p>

<div class="category-card-meta">

<span>
${formatDate(date)}
</span>

<span>
${escapeHtml(readTime)}
</span>

</div>

</div>

</article>
`;

}

function getDescription(name){

const key=name.toLowerCase();

const descriptions={

ai:
"Artificial intelligence, machine learning, AI agents, models and the technologies reshaping the future.",

technology:
"Technology, innovation, digital infrastructure and the developments changing how the world works.",

business:
"Markets, companies, industries, economic developments and the forces shaping global business.",

science:
"Scientific discoveries, research, breakthroughs and the evidence behind important developments.",

world:
"Important developments, events and stories from around the world, with context beyond the headline.",

politics:
"Political developments, public policy, leadership and the decisions shaping societies.",

latest:
"The latest stories published by AI News Factory across our global newsroom.",

all:
"Explore every published story from the AI News Factory newsroom."
};

return descriptions[key]||
"News, analysis and intelligent reporting from the AI News Factory newsroom.";

}

function formatDate(value){

if(!value)return"";

const date=new Date(value);

if(Number.isNaN(date.getTime()))return String(value);

return date.toLocaleDateString("en-US",{
year:"numeric",
month:"short",
day:"numeric"
});

}

function activateCategoryNav(active){

document.querySelectorAll(".category-nav a").forEach(link=>{

const url=new URL(link.href,location.href);
const value=url.searchParams.get("category")||"Latest";

if(value.toLowerCase()===active.toLowerCase()){
link.classList.add("active");
}

});

}

function escapeHtml(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

});
</script>

</body>
  </html>
