name: Notify News Distribution Bot

on:
  push:
    branches:
      - main
    paths:
      - "articles/**"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Notify distribution bot
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_BOT_TOKEN }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/nyonggodspower726-wq/news-distribution-botv2/dispatches \
            -d '{"event_type":"new_article"}'
