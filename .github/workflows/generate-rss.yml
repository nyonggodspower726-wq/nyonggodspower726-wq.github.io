name: Generate News RSS Feed

on:
  push:
    branches:
      - main
    paths:
      - "articles/**"
      - "generate_rss.py"
      - ".github/workflows/generate-rss.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout newsroom
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate RSS feed
        run: |
          python generate_rss.py

      - name: Commit RSS feed
        run: |
          git config user.name "Newsroom RSS Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rss.xml

          if git diff --cached --quiet; then
            echo "No RSS changes."
          else
            git commit -m "Update newsroom RSS feed"
            git push
          fi
